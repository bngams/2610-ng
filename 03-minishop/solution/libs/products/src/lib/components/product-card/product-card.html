<mat-card appearance="outlined">
  <img mat-card-image [src]="product().thumbnail" [alt]="product().name" />
  <mat-card-header>
    <mat-card-title>{{ product().name }}</mat-card-title>
    <mat-card-subtitle
      >{{ product().category }} · {{ product().price | currency: 'USD' }}</mat-card-subtitle
    >
  </mat-card-header>
  <mat-card-content>
    <p>{{ product().description }}</p>
  </mat-card-content>
  <mat-card-actions>
    <!-- un emplacement libre pour les actions de l'application (un lien « Détails »...) -->
    <ng-content />
    @if (canAdd()) {
      <button mat-flat-button type="button" (click)="add.emit(product())">Ajouter</button>
    }
  </mat-card-actions>
</mat-card>
